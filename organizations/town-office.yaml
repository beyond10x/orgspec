format: orgspec-organization/1
organization: town-office
type: regulated
origin: invented
summary: The residents' office of a small town, under a council and a supervising state office.

parts:
  town:              { block: organization, form: public_body, purpose: "Give residents the permits and papers the law entitles them to." }
  council:           { block: unit, nature: governing, in: town }
  office:            { block: unit, nature: line, basis: function, in: town }
  audit:             { block: unit, nature: line, basis: function, in: town }
  head_role:         { block: role, purpose: "Runs the office and answers to the council." }
  clerk_role:        { block: role, purpose: "Takes requests and prepares decisions." }
  treasurer_role:    { block: role, purpose: "Releases payments." }
  auditor_role:      { block: role, kind: compliance_officer }
  office_head:       { block: position, in: office, role: head_role }
  clerk:             { block: position, in: office, role: clerk_role, seats: 6 }
  treasurer:         { block: position, in: office, role: treasurer_role }
  auditor:           { block: position, in: audit, role: auditor_role }
  permits:           { block: offering, audience: external }
  residents:         { block: relationship, tie: beneficiary }
  state_office:      { block: relationship, tie: regulator }
  resident_register: { block: asset, kind: register, retention: 1560w, criticality: high }
  permit_decision:   { block: decision_class, kind: controlled }
  payment:           { block: decision_class, kind: controlled }
  budget_plan:       { block: decision_class }
  data_protection:   { block: obligation, source: law, about: resident_register }
  procurement_rules: { block: obligation, source: law, about: office }
  wrong_permit:      { block: risk, about: permits, likelihood: medium, impact: high, treatment: reduce }
  office_budget:     { block: budget, amount: 900000, currency: EUR, period: 52w, for: office }
  session:           { block: forum, convenes: council, every: 4w }

