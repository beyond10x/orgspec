    status: planned

  - id: budget_approved_share
    block: budget
    measures: completeness
    over: unit
    unit: share
    summary: Share of a unit's proposed budgets whose period has begun that are approved.
    how: Budgets proposed for the unit whose period has begun and that have a BudgetApproved, divided by the budgets proposed for the unit whose period has begun.
    direction: higher
    gate: false
    reads: [org.budget.BudgetProposed, org.budget.BudgetApproved]
    status: planned

  - id: budget_overrun_share
    block: budget
    measures: quality
    over: unit
    unit: share
    summary: Share of a unit's approved budgets that were overrun.
    how: Budgets of the unit with at least one BudgetOverrun, divided by the unit's budgets with a BudgetApproved, over the budgets whose period ends in the window.
    direction: lower
    gate: false
    reads: [org.budget.BudgetProposed, org.budget.BudgetApproved, org.budget.BudgetOverrun]
    status: planned

  - id: budget_unspent_share
    block: budget
    measures: quality
    over: budget
    unit: share
    summary: Share of a closed budget's amount that was not spent.
    how: The amount of BudgetProposed minus the spent of BudgetClosed, not below 0, divided by the amount.
    direction: lower
    postures: { explore: ignore, scale: lower, operate: lower }
    gate: false
    reads: [org.budget.BudgetProposed, org.budget.BudgetClosed]
    status: planned

  - id: step_role_without_position
    block: process
    measures: correctness
    over: process
    unit: count
    summary: Steps of a process in force whose role no open position plays.
    how: Steps listed and not removed on a process put in force and not retired whose role_id is the role of no position established and not closed. Must be 0.
