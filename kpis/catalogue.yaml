    unit: count
    summary: Parts that nothing in the design names.
    how: Refusals of the structural rule unreachable_parts that orgspec check prints for a design, one per part that no link, no `in`, `role` or `convenes` and no border entry names. An organization part is exempt. Must be 0.
    direction: lower
    gate: true
    reads: []
    status: checked

  - id: revision_under_type_share
    block: design
    measures: completeness
    over: design
    unit: share
    summary: Share of a design's committed revisions that name their type.
    how: RevisionCommitted events whose revision has a RevisionPutUnderType before the commit, divided by the RevisionCommitted events of the design.
    direction: higher
    gate: false
    reads: [org.design.RevisionOpened, org.design.RevisionPutUnderType, org.design.RevisionCommitted]
    status: planned

  - id: measurement_of_retired_kpi
    block: kpi
    measures: correctness
    over: organization
    unit: count
    summary: Measurements recorded for a KPI after it was retired.
    how: MeasurementRecorded events timestamped after the KpiRetired of their KPI. Must be 0.
    direction: lower
    gate: true
    reads: [org.kpi.KpiRetired, org.kpi.MeasurementRecorded]
    status: planned

  - id: kpi_direction_set_share
    block: kpi
    measures: completeness
    over: organization
    unit: share
    summary: Share of the pairs of a KPI and a posture that have a direction.
    how: Pairs of a KPI defined and not retired and a posture created that have a DirectionSet, divided by all such pairs. A pair without one cannot be weighed in a search.
    direction: higher
    gate: false
    reads: [org.kpi.KpiDefined, org.kpi.KpiRetired, org.kpi.PostureCreated, org.kpi.DirectionSet]
    status: planned

  - id: kpi_measurement_age_days
    block: kpi
    measures: quality
    over: organization
    unit: days
    summary: Age of the oldest last measurement among the KPIs in use.
    how: Days from the last MeasurementRecorded of each KPI defined and not retired to the end of the window; the largest over those KPIs. A KPI never measured counts from its KpiDefined.
    direction: lower
    gate: false
    reads: [org.kpi.KpiDefined, org.kpi.KpiRetired, org.kpi.MeasurementRecorded]
    status: planned

  - id: experiment_on_uncommitted_revision
    block: experiment
    measures: correctness
    over: design
    unit: count
    summary: Experiments planned on a design revision that was not committed.
    how: ExperimentPlanned events whose revision_id has no RevisionCommitted before them. Must be 0.
    direction: lower
    gate: true
    reads: [org.experiment.ExperimentPlanned, org.design.RevisionCommitted]
    status: planned

  - id: experiment_done_share
    block: experiment
    measures: completeness
    over: design
    unit: share
    summary: Share of the ended experiments on a design that ended done.
    how: ExperimentDone events divided by the sum of ExperimentDone and ExperimentFailed events, over the experiments planned on revisions of the design.
    direction: higher
    gate: false
    reads: [org.experiment.ExperimentPlanned, org.experiment.ExperimentDone, org.experiment.ExperimentFailed, org.design.RevisionOpened]
    status: planned

  - id: feasible_variant_share
    block: experiment
    measures: quality
    over: design
    unit: share
    summary: Share of the variants a search recorded that pass every gate KPI.
    how: VariantRecorded events with feasible true, divided by all VariantRecorded events of the experiments planned on revisions of the design.
    direction: higher
    gate: false
    reads: [org.experiment.ExperimentPlanned, org.experiment.VariantRecorded, org.design.RevisionOpened]
    status: planned

  - id: experiment_fitness_gain
    block: experiment
    measures: quality
    over: design
    unit: points
    summary: Fitness a search gained over the design it started from.
    how: The highest fitness among the VariantRecorded events with feasible true of an experiment, minus the fitness of its first VariantRecorded; the largest over the done experiments on revisions of the design.
    direction: higher
    gate: false
    reads: [org.experiment.ExperimentPlanned, org.experiment.VariantRecorded, org.experiment.ExperimentDone, org.design.RevisionOpened]
    status: planned
