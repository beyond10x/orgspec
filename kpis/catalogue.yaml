    gate: true
    reads: [org.asset.AssetPlanned, org.asset.AssetPutInUse, org.asset.AssetCriticalityChanged, org.asset.AssetRetired, org.responsibility.AccountabilityAssigned, org.responsibility.AccountabilityTransferred, org.responsibility.AccountabilityReleased]
