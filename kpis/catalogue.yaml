    how: WorkItemOpened events with a step_id whose at_position was established with a role_id other than the role_id of that step's StepListed. Must be 0.
    direction: lower
    gate: true
    reads: [org.work.WorkItemOpened, org.process.StepListed, org.position.PositionEstablished]
    status: planned

  - id: request_closed_share
    block: work
    measures: completeness
    over: offering
    unit: share
    summary: Share of the requests received in a window that reached an end.
    how: Requests received in the window with a RequestFulfilled, RequestDeclined or RequestCancelled, divided by the RequestReceived events of the window.
    direction: higher
    gate: false
    reads: [org.work.RequestReceived, org.work.RequestFulfilled, org.work.RequestDeclined, org.work.RequestCancelled]
    status: planned

  - id: request_lead_seconds
    block: work
    measures: quality
    over: offering
    unit: seconds
    summary: Lead time of a request, from its arrival to its fulfilment.
    how: Seconds from RequestReceived to RequestFulfilled of the same request; the median per offering. Declined and cancelled requests are left out.
    direction: lower
    gate: false
    reads: [org.work.RequestReceived, org.work.RequestFulfilled]
    status: simulated

  - id: handoff_wait_seconds
    block: work
    measures: quality
    over: position
    unit: seconds
    summary: Time work waits at a hand-off before the receiving position takes or refuses it.
    how: Seconds from HandoffOffered to the HandoffAccepted or HandoffRefused of the same hand-off; the median per receiving position.
    direction: lower
    gate: false
    reads: [org.work.HandoffOffered, org.work.HandoffAccepted, org.work.HandoffRefused]
    status: simulated

  - id: handoff_wait_share
    block: work
    measures: quality
    over: offering
    unit: share
    summary: Share of a request's lead time that its work spent waiting at hand-offs.
    how: Seconds from HandoffOffered to HandoffAccepted or HandoffRefused, summed over the work items opened for a request, divided by the seconds from its RequestReceived to its RequestFulfilled; the mean over the offering's fulfilled requests.
    direction: lower
    gate: false
    reads: [org.work.RequestReceived, org.work.RequestFulfilled, org.work.WorkItemOpened, org.work.HandoffOffered, org.work.HandoffAccepted, org.work.HandoffRefused]
    status: simulated

  - id: commitment_broken_share
    block: work
    measures: quality
    over: unit
    unit: share
    summary: Share of the commitments that came due in a window and were broken.
    how: Commitments with a CommitmentSlipped in the window, divided by the commitments made by the unit's positions whose due date, after the last CommitmentRenegotiated, lies in the window. A commitment met or released before its due date counts as not broken.
    direction: lower
    gate: false
    reads: [org.work.CommitmentMade, org.work.CommitmentRenegotiated, org.work.CommitmentSlipped, org.work.CommitmentMet, org.work.CommitmentReleased, org.position.PositionEstablished, org.position.PositionMoved]
    status: planned

  - id: work_blocked_share
    block: work
    measures: quality
    over: process
    unit: share
    summary: Share of the time work items were in progress that they were blocked.
    how: Seconds from WorkItemBlocked to the next WorkItemUnblocked, WorkItemCompleted or WorkItemDropped, summed, divided by the seconds from WorkItemStarted to WorkItemCompleted or WorkItemDropped, over the work items opened on the process.
    direction: lower
    gate: false
    reads: [org.work.WorkItemOpened, org.work.WorkItemStarted, org.work.WorkItemBlocked, org.work.WorkItemUnblocked, org.work.WorkItemCompleted, org.work.WorkItemDropped]
    status: planned

  - id: idle_capacity_share
    block: work
    measures: quality
    over: position
    unit: share
    summary: Share of a position's held capacity with no work item in progress.
    how: 1 minus busy seconds divided by capacity seconds. Busy seconds run from WorkItemStarted to WorkItemCompleted or WorkItemDropped at the position, less the blocked time; capacity seconds are the window times the summed shares of the position's started and not ended assignments.
    direction: lower
    postures: { explore: higher, scale: lower, operate: lower }
    gate: false
    reads: [org.work.WorkItemStarted, org.work.WorkItemBlocked, org.work.WorkItemUnblocked, org.work.WorkItemCompleted, org.work.WorkItemDropped, org.assignment.AssignmentProposed, org.assignment.AssignmentStarted, org.assignment.ShareChanged, org.assignment.AssignmentEnded]
    status: simulated

  - id: cost_per_fulfilled_request
    block: work
    measures: quality
    over: organization
    unit: money
    summary: Spend of a window divided by the requests fulfilled in it.
    how: The increase of the running total `spent` over the window, summed over the organization's budgets from BudgetSpendRecorded and BudgetClosed, divided by the RequestFulfilled events of the window. Requests not fulfilled still cost, so an organization that fulfils less shows a higher value.
    direction: lower
    postures: { explore: ignore, scale: lower, operate: lower }
    gate: false
    reads: [org.budget.BudgetProposed, org.budget.BudgetSpendRecorded, org.budget.BudgetClosed, org.work.RequestFulfilled]
    status: planned

