    direction: higher
    gate: false
    reads: [org.asset.AssetPlanned, org.asset.AssetPutInUse, org.asset.AssetCriticalityChanged, org.asset.AssetRetired, org.risk.RiskIdentified]
    status: planned

  - id: asset_planned_days
    block: asset
    measures: quality
    over: organization
    unit: days
