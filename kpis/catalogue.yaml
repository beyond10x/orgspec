    gate: false
    reads: [org.asset.AssetPlanned, org.asset.AssetPutInUse]
    status: planned

  - id: spend_on_unapproved_budget
    block: budget
    measures: correctness
    over: budget
    unit: count
    summary: Spend recorded on a budget that was not approved or was already closed.
    how: BudgetSpendRecorded events with no BudgetApproved of the budget before them or with its BudgetClosed before them. Must be 0.
