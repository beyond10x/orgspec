format: orgspec-kpis/1
kpis:
  - id: retired_party_with_membership
    block: party
    measures: correctness
    over: organization
    unit: count
    summary: Memberships still open for a party that was retired.
    how: Memberships with a MemberJoined or MemberInvited and no MembershipEnded whose party has a PartyRetired. Must be 0.
    direction: lower
    gate: true
    reads: [org.party.PartyRetired, org.membership.MemberInvited, org.membership.MemberJoined, org.membership.MembershipEnded]
    status: planned

  - id: membership_party_registered_share
    block: party
    measures: completeness
    over: organization
    unit: share
    summary: Share of memberships whose party is a registered party.
    how: MemberInvited events whose party_id has a PartyRegistered before them, divided by all MemberInvited events of the organization. Must be 1.
    direction: higher
    gate: true
    reads: [org.party.PartyRegistered, org.membership.MemberInvited]
    status: planned

  - id: activity_in_dissolved_organization
    block: organization
    measures: correctness
    over: organization
    unit: count
    summary: Members joined, units formed and requests received after the organization was dissolved.
    how: MemberJoined, UnitFormed and RequestReceived events of an organization timestamped after its OrganizationDissolved. Must be 0.
    direction: lower
    gate: true
    reads: [org.organization.OrganizationDissolved, org.membership.MemberJoined, org.unit.UnitFormed, org.work.RequestReceived]
    status: planned

  - id: organization_with_governing_unit_share
    block: organization
    measures: completeness
    over: organization
    unit: share
    summary: Share of started organizations that have a governing unit.
    how: The organization and the organizations whose parent chain (OrganizationFounded, ParentSet, ParentCleared) reaches it, counted when started, not dissolved and holding at least one UnitFormed of nature governing without a UnitDisbanded, divided by those started and not dissolved.
    direction: higher
    gate: false
    reads: [org.organization.OrganizationFounded, org.organization.OrganizationStarted, org.organization.OrganizationDissolved, org.organization.ParentSet, org.organization.ParentCleared, org.unit.UnitFormed, org.unit.UnitDisbanded]
    status: planned

  - id: organization_suspended_share
    block: organization
    measures: quality
    over: organization
    unit: share
    summary: Share of its life an organization spent suspended.
    how: Seconds between each OrganizationSuspended and the next OrganizationResumed or OrganizationDissolved, summed, divided by the seconds from OrganizationStarted to OrganizationDissolved or to the end of the window.
    direction: lower
    gate: false
    reads: [org.organization.OrganizationStarted, org.organization.OrganizationSuspended, org.organization.OrganizationResumed, org.organization.OrganizationDissolved]
    status: planned

  - id: part_outside_organization
    block: unit
    measures: correctness
    over: design
    unit: count
    summary: Units placed in no organization or unit, and positions placed in no unit.
    how: Refusals of the structural rule part_outside_organization that orgspec check prints for a design, one per unit part whose `in` names no organization or unit part and per position part whose `in` names no unit part. Must be 0.
    direction: lower
    gate: true
    reads: []
    status: checked

  - id: position_in_disbanded_unit
    block: unit
    measures: correctness
    over: organization
    unit: count
    summary: Open positions that sit in a disbanded unit.
    how: Positions with a PositionEstablished and no PositionClosed whose unit, after the last PositionMoved, has a UnitDisbanded. Must be 0.
    direction: lower
    gate: true
    reads: [org.unit.UnitDisbanded, org.position.PositionEstablished, org.position.PositionMoved, org.position.PositionClosed]
    status: planned

  - id: unit_with_position_share
    block: unit
    measures: completeness
    over: organization
    unit: share
    summary: Share of units that hold at least one position, directly or in a unit below them.
    how: Units formed and not disbanded with at least one open position in them or in a unit under them in the tree (UnitFormed, UnitMoved, UnitMovedToTop), divided by units formed and not disbanded.
    direction: higher
    gate: false
    reads: [org.unit.UnitFormed, org.unit.UnitMoved, org.unit.UnitMovedToTop, org.unit.UnitDisbanded, org.position.PositionEstablished, org.position.PositionMoved, org.position.PositionClosed]
    status: planned

  - id: unknown_role
    block: role
    measures: correctness
    over: design
    unit: count
    summary: Positions whose role names no role part.
    how: Refusals of the structural rule unknown_role that orgspec check prints for a design, one per position part whose `role` names no part of block role. Must be 0.
    direction: lower
    gate: true
    reads: []
    status: checked

  - id: role_with_expectations_share
    block: role
    measures: completeness
    over: organization
    unit: share
    summary: Share of active roles that state at least one expectation.
    how: Roles with a RoleActivated and no RoleRetired whose expectations list in the last of RoleDrafted, RoleDraftEdited and RoleRevised is not empty, divided by roles activated and not retired.
    direction: higher
    gate: false
    reads: [org.role.RoleDrafted, org.role.RoleDraftEdited, org.role.RoleActivated, org.role.RoleRevised, org.role.RoleRetired]
    status: planned

  - id: role_revision_count
    block: role
    measures: quality
    over: role
    unit: count
    summary: Times an active role's purpose or expectations changed in a window.
    how: RoleRevised events of the role in the window. A role that keeps changing tells its holders little about what is expected.
    direction: lower
    postures: { explore: ignore, scale: lower, operate: lower }
    gate: false
    reads: [org.role.RoleRevised]
    status: planned

  - id: reporting_cycle
    block: position
    measures: correctness
    over: design
    unit: count
    summary: Cycles in the reporting lines.
    how: Refusals of the structural rule reporting_cycle that orgspec check prints for a design, one per cycle formed by `reports_to` links. Must be 0.
    direction: lower
    gate: true
    reads: []
    status: checked

  - id: seats_filled_share
    block: position
    measures: completeness
    over: unit
    unit: share
    summary: Share of a unit's seats that are held.
    how: Per open position the sum of the shares of its started and not ended assignments (AssignmentProposed, ShareChanged), capped at its seats, summed over the unit's positions and divided by the sum of their seats (PositionEstablished, SeatsSet). The vacant share is 1 minus this.
    direction: higher
    postures: { explore: ignore, scale: higher, operate: higher }
    gate: false
    reads: [org.position.PositionEstablished, org.position.SeatsSet, org.position.PositionMoved, org.position.PositionClosed, org.assignment.AssignmentProposed, org.assignment.AssignmentStarted, org.assignment.ShareChanged, org.assignment.AssignmentEnded]
    status: planned

  - id: span_of_control
    block: position
    measures: quality
    over: position
    unit: ratio
    summary: Seats that report to a position, per seat of that position.
    how: Seats of the open positions whose reports_to names the position (PositionEstablished, ReportsToSet, ReportsToCleared, SeatsSet), divided by the position's own seats. Positions nobody reports to are left out.
    direction: lower
    postures: { explore: lower, scale: lower, operate: higher }
    gate: false
    reads: [org.position.PositionEstablished, org.position.SeatsSet, org.position.ReportsToSet, org.position.ReportsToCleared, org.position.PositionClosed]
    status: planned

  - id: reporting_depth
    block: position
    measures: quality
    over: organization
    unit: count
    summary: Depth of the reporting tree.
    how: Number of reports_to steps on the longest chain from an open position to a position that reports to no position, over the positions in the organization's units.
    direction: lower
    gate: false
    reads: [org.position.PositionEstablished, org.position.ReportsToSet, org.position.ReportsToCleared, org.position.PositionClosed, org.unit.UnitFormed]
    status: planned

  - id: assignment_without_active_membership
    block: membership
    measures: correctness
    over: organization
    unit: count
    summary: Positions held through a membership that is suspended or ended.
    how: Assignments with an AssignmentStarted and no AssignmentEnded whose membership has a MembershipEnded, or a MembershipSuspended with no later MembershipResumed. Must be 0.
    direction: lower
    gate: true
    reads: [org.membership.MembershipSuspended, org.membership.MembershipResumed, org.membership.MembershipEnded, org.assignment.AssignmentStarted, org.assignment.AssignmentEnded]
    status: planned

  - id: member_with_position_share
    block: membership
    measures: completeness
    over: organization
    unit: share
    summary: Share of active memberships that hold at least one position.
    how: Memberships joined, not suspended and not ended with at least one started and not ended assignment, divided by memberships joined, not suspended and not ended.
    direction: higher
    gate: false
    reads: [org.membership.MemberJoined, org.membership.MembershipSuspended, org.membership.MembershipResumed, org.membership.MembershipEnded, org.assignment.AssignmentStarted, org.assignment.AssignmentEnded]
    status: planned

  - id: membership_ended_share
    block: membership
    measures: quality
    over: organization
    unit: share
    summary: Share of the active memberships of a window's start that ended in the window.
    how: MembershipEnded events in the window with ended_from Active or Suspended, divided by the memberships joined and not ended at the start of the window.
    direction: lower
    gate: false
    reads: [org.membership.MemberJoined, org.membership.MembershipEnded]
    status: planned

  - id: agent_without_accountable_human
    block: assignment
    measures: correctness
    over: design
    unit: count
    summary: Positions held by agents with no chain to a position held by humans.
    how: Refusals of the structural rule agent_without_accountable_human that orgspec check prints for a design, one per position part held by agents, alone or mixed, whose `answers_to` chain does not end at a position held by humans. Must be 0.
    direction: lower
    gate: true
    reads: []
    status: checked

  - id: agent_assignment_chain_broken
    block: assignment
    measures: correctness
    over: organization
    unit: count
    summary: Running assignments of agents whose chain of answering positions reaches no position held by a human.
    how: Assignments started and not ended with holder_kind agent, followed from answers_to (AssignmentProposed, AccountablePositionChanged) through the started assignments of each answering position, that reach no position with a started assignment of holder_kind human. Must be 0.
    direction: lower
    gate: true
    reads: [org.assignment.AssignmentProposed, org.assignment.AssignmentStarted, org.assignment.AccountablePositionChanged, org.assignment.AssignmentEnded]
    status: planned

  - id: acting_assignment_share
    block: assignment
    measures: quality
    over: unit
    unit: share
    summary: Share of a unit's held seats that are held in an acting capacity.
    how: Shares of the started and not ended assignments proposed with acting true, summed over the unit's positions, divided by the summed shares of all started and not ended assignments on those positions.
    direction: lower
    gate: false
    reads: [org.assignment.AssignmentProposed, org.assignment.AssignmentStarted, org.assignment.ShareChanged, org.assignment.AssignmentEnded, org.position.PositionEstablished, org.position.PositionMoved]
    status: planned

  - id: seat_refill_days
    block: assignment
    measures: quality
    over: role
    unit: days
    summary: Days a seat stays empty between one holder and the next.
    how: Days from an AssignmentEnded with ended_from Started that leaves a seat of a position uncovered to the next AssignmentStarted on that position; the mean over the positions that play the role.
    direction: lower
    gate: false
    reads: [org.assignment.AssignmentStarted, org.assignment.AssignmentEnded, org.position.PositionEstablished, org.position.SeatsSet]
    status: planned

  - id: requirement_on_retired_skill
    block: competence
    measures: correctness
    over: organization
    unit: count
    summary: Requirements of roles that name a retired skill.
    how: Requirements with a RequirementSet and no RequirementDropped whose skill has a SkillRetired. Must be 0.
    direction: lower
    gate: true
    reads: [org.competence.SkillRetired, org.competence.RequirementSet, org.competence.RequirementDropped]
    status: planned

  - id: requirement_met_share
    block: competence
    measures: completeness
    over: role
    unit: share
    summary: Share of a role's skill requirements that the holders of its seats meet.
    how: Pairs of a started assignment on a position that plays the role and a requirement of the role where the holding party's proficiency level (ProficiencyRecorded, ProficiencyReassessed, not withdrawn) is at or above the required level (RequirementSet, RequirementChanged), divided by all such pairs.
    direction: higher
    gate: false
    reads: [org.competence.RequirementSet, org.competence.RequirementChanged, org.competence.RequirementDropped, org.competence.ProficiencyRecorded, org.competence.ProficiencyReassessed, org.competence.ProficiencyWithdrawn, org.assignment.AssignmentProposed, org.assignment.AssignmentStarted, org.assignment.AssignmentEnded, org.position.PositionEstablished, org.membership.MemberJoined]
    status: planned

  - id: skill_with_single_holder
    block: competence
    measures: quality
    over: organization
    unit: count
    summary: Required skills that exactly one held seat covers at the required level.
    how: Skills named by a requirement in force for which exactly one started and not ended assignment belongs to a party whose proficiency is at or above the lowest level any role requires. The count is of skills, not of holders.
    direction: lower
    postures: { explore: ignore, scale: lower, operate: lower }
    gate: false
    reads: [org.competence.RequirementSet, org.competence.RequirementChanged, org.competence.RequirementDropped, org.competence.ProficiencyRecorded, org.competence.ProficiencyReassessed, org.competence.ProficiencyWithdrawn, org.assignment.AssignmentProposed, org.assignment.AssignmentStarted, org.assignment.AssignmentEnded, org.membership.MemberJoined]
    status: planned

  - id: class_without_decider
    block: decision
    measures: correctness
    over: design
    unit: count
    summary: Decision classes nobody decides.
    how: Refusals of the structural rule class_without_decider that orgspec check prints for a design, one per decision class part with no incoming `decides` link. Must be 0.
    direction: lower
    gate: true
    reads: []
    status: checked

  - id: class_with_two_deciders
    block: decision
    measures: correctness
    over: design
    unit: count
    summary: Decision classes with two deciders for the same scope.
    how: Refusals of the structural rule class_with_two_deciders that orgspec check prints for a design, one per pair of `decides` links to one class with the same `scope`, where no scope means the whole organization. Must be 0.
    direction: lower
    gate: true
    reads: []
    status: checked

  - id: decider_not_allowed
    block: decision
    measures: correctness
    over: design
    unit: count
    summary: Decision rights held by a part that is neither a position nor a governing unit.
    how: Refusals of the structural rule decider_not_allowed that orgspec check prints for a design, one per `decides` link that starts at a part that is neither a position nor a unit of nature governing. Must be 0.
    direction: lower
    gate: true
    reads: []
    status: checked

  - id: decision_without_right
    block: decision
    measures: correctness
    over: decision_class
    unit: count
    summary: Decisions taken by a position that held no right to take them.
    how: DecisionTaken events whose right_id names no right enacted and not revoked at that instant, or whose decided_by is neither the deciding position of that right, a position in its deciding unit, nor the `to` of a delegation of the class granted and neither revoked nor expired. Must be 0.
    direction: lower
    gate: true
    reads: [org.decision.DecisionTaken, org.decision.DecisionRightProposed, org.decision.DecisionRightEnacted, org.decision.DecisionRightRevoked, org.delegation.DelegationGranted, org.delegation.DelegationRevoked, org.delegation.DelegationExpired, org.position.PositionEstablished, org.position.PositionMoved]
    status: planned

  - id: decision_latency_seconds
    block: decision
    measures: quality
    over: decision_class
    unit: seconds
    summary: Time a decision waits for its decider.
    how: Seconds from DecisionOpened to the DecisionTaken or DecisionTakenOnDefault of the same decision; the median per decision class. Withdrawn decisions are left out.
    direction: lower
    gate: false
    reads: [org.decision.DecisionOpened, org.decision.DecisionTaken, org.decision.DecisionTakenOnDefault, org.decision.DecisionWithdrawn]
    status: simulated

  - id: decision_on_default_share
    block: decision
    measures: quality
    over: decision_class
    unit: share
    summary: Share of decisions that took their default because the decider did not answer in time.
    how: DecisionTakenOnDefault events divided by the sum of DecisionTaken and DecisionTakenOnDefault events of the class.
    direction: lower
    gate: false
    reads: [org.decision.DecisionTaken, org.decision.DecisionTakenOnDefault]
    status: planned

  - id: delegation_without_right
    block: delegation
    measures: correctness
    over: design
    unit: count
    summary: Delegations of a decision class the delegating part does not hold.
    how: Refusals of the structural rule delegation_without_right that orgspec check prints for a design, one per `delegates` link whose `class` its `from` part neither decides nor holds by a delegation. Must be 0.
    direction: lower
    gate: true
    reads: []
    status: checked

  - id: delegation_exceeds_limit
    block: delegation
    measures: correctness
    over: design
    unit: count
    summary: Delegations with a limit above the limit of the delegating part.
    how: Refusals of the structural rule delegation_exceeds_limit that orgspec check prints for a design, one per `delegates` link whose `limit` is above the limit its `from` part holds for the class. Must be 0.
    direction: lower
    gate: true
    reads: []
    status: checked

  - id: approval_above_delegation_limit
    block: delegation
    measures: correctness
    over: decision_class
    unit: count
    summary: Budgets approved under a delegation whose limit is below the budget's amount.
    how: BudgetApproved events whose approving decision (the DecisionTaken named by approved_by) was decided by the `to` position of a delegation in force for the decision's class, where that position is not the decider of the right the decision names and the amount of the BudgetProposed is above the delegation's limit. Must be 0.
    direction: lower
    gate: true
    reads: [org.delegation.DelegationGranted, org.delegation.DelegationRevoked, org.delegation.DelegationExpired, org.decision.DecisionTaken, org.decision.DecisionRightProposed, org.budget.BudgetProposed, org.budget.BudgetApproved]
    status: planned

  - id: delegation_with_end_share
    block: delegation
    measures: completeness
    over: decision_class
    unit: share
    summary: Share of the delegations in force that carry an end.
    how: DelegationGranted events with an `until`, neither revoked nor expired, divided by all DelegationGranted events of the class neither revoked nor expired.
    direction: higher
    gate: false
    reads: [org.delegation.DelegationGranted, org.delegation.DelegationRevoked, org.delegation.DelegationExpired]
    status: planned

  - id: delegation_chain_length
    block: delegation
    measures: quality
    over: decision_class
    unit: count
    summary: Longest chain of delegations that passes a decision class on.
    how: Number of delegations in force on the longest path where the `to` of one DelegationGranted of the class is the `from` of the next.
    direction: lower
    gate: false
    reads: [org.delegation.DelegationGranted, org.delegation.DelegationRevoked, org.delegation.DelegationExpired]
    status: planned

  - id: policy_adopted_without_decision
    block: policy
    measures: correctness
    over: policy
    unit: count
    summary: Adoptions and revisions of a policy that no taken decision stands behind.
    how: PolicyAdopted and PolicyRevised events whose adopted_by names no DecisionTaken or DecisionTakenOnDefault timestamped before them. Must be 0.
    direction: lower
    gate: true
    reads: [org.policy.PolicyAdopted, org.policy.PolicyRevised, org.decision.DecisionTaken, org.decision.DecisionTakenOnDefault]
    status: planned

  - id: waiver_past_end
    block: policy
    measures: correctness
    over: policy
    unit: count
    summary: Waivers still open after their end or after their policy was retired.
    how: WaiverGranted events with no WaiverEnded whose `until` lies before the end of the window or whose policy has a PolicyRetired. Must be 0.
    direction: lower
    gate: true
    reads: [org.policy.WaiverGranted, org.policy.WaiverEnded, org.policy.PolicyRetired]
    status: planned

  - id: policy_waiver_count
    block: policy
    measures: quality
    over: policy
    unit: count
    summary: Open waivers from a policy in force.
    how: WaiverGranted events of the policy with no WaiverEnded, counted while the policy is adopted and not retired. A policy with many waivers binds little of its scope.
    direction: lower
    gate: false
    reads: [org.policy.PolicyAdopted, org.policy.PolicyRetired, org.policy.WaiverGranted, org.policy.WaiverEnded]
    status: planned

  - id: demand_without_offering
    block: offering
    measures: correctness
    over: design
    unit: count
    summary: Demand links that do not run from a relationship to an offering.
    how: Refusals of the structural rule demand_without_offering that orgspec check prints for a design, one per `demand` link whose `from` is no relationship part or whose `to` is no offering part. Must be 0.
    direction: lower
    gate: true
    reads: []
    status: checked

  - id: request_for_unoffered_offering
    block: offering
    measures: correctness
    over: offering
    unit: count
    summary: Requests received for an offering that was not on offer.
    how: RequestReceived events whose offering has no OfferingOffered before them or an OfferingWithdrawn before them. Must be 0.
    direction: lower
    gate: true
    reads: [org.offering.OfferingOffered, org.offering.OfferingWithdrawn, org.work.RequestReceived]
    status: planned

  - id: offering_with_engagement_share
    block: offering
    measures: completeness
    over: organization
    unit: share
    summary: Share of the external offerings on offer that at least one relationship takes.
    how: Offerings proposed with internal false, offered and not withdrawn, with at least one EngagementOpened that has no EngagementClosed, divided by offerings proposed with internal false, offered and not withdrawn.
    direction: higher
    gate: false
    reads: [org.offering.OfferingProposed, org.offering.OfferingOffered, org.offering.OfferingWithdrawn, org.relationship.EngagementOpened, org.relationship.EngagementClosed]
    status: planned

  - id: request_fulfilled_share
    block: offering
    measures: quality
    over: offering
    unit: share
    summary: Share of the closed requests for an offering that were fulfilled.
    how: RequestFulfilled events divided by the sum of RequestFulfilled, RequestDeclined and RequestCancelled events for the offering named by their RequestReceived.
    direction: higher
    gate: false
    reads: [org.work.RequestReceived, org.work.RequestFulfilled, org.work.RequestDeclined, org.work.RequestCancelled]
    status: planned

  - id: engagement_on_ended_relationship
    block: relationship
    measures: correctness
    over: relationship
    unit: count
    summary: Engagements still open after their relationship ended.
    how: EngagementOpened events with no EngagementClosed whose relationship has a RelationshipEnded. Must be 0.
    direction: lower
    gate: true
    reads: [org.relationship.RelationshipEnded, org.relationship.EngagementOpened, org.relationship.EngagementClosed]
    status: planned

  - id: relationship_with_engagement_share
    block: relationship
    measures: completeness
    over: organization
    unit: share
    summary: Share of the active customer and beneficiary relationships that take at least one offering.
    how: Relationships opened with tie customer or beneficiary, activated, not suspended and not ended, with at least one open engagement, divided by all such relationships.
    direction: higher
    gate: false
    reads: [org.relationship.RelationshipOpened, org.relationship.RelationshipActivated, org.relationship.RelationshipSuspended, org.relationship.RelationshipResumed, org.relationship.RelationshipEnded, org.relationship.EngagementOpened, org.relationship.EngagementClosed]
    status: planned

  - id: engagements_per_relationship
    block: relationship
    measures: quality
    over: organization
    unit: ratio
    summary: Open engagements per active relationship.
    how: EngagementOpened events with no EngagementClosed, divided by the relationships activated, not suspended and not ended that hold at least one of them.
    direction: higher
    gate: false
    reads: [org.relationship.RelationshipActivated, org.relationship.RelationshipSuspended, org.relationship.RelationshipResumed, org.relationship.RelationshipEnded, org.relationship.EngagementOpened, org.relationship.EngagementClosed]
    status: planned

  - id: relationship_ended_share
    block: relationship
    measures: quality
    over: organization
    unit: share
    summary: Share of the relationships active at a window's start that ended in the window.
    how: RelationshipEnded events in the window, divided by the relationships activated and not ended at the start of the window.
    direction: lower
    postures: { explore: ignore, scale: lower, operate: lower }
    gate: false
    reads: [org.relationship.RelationshipActivated, org.relationship.RelationshipEnded]
    status: planned

  - id: goal_committed_without_key_result
    block: goal
    measures: correctness
    over: organization
    unit: count
    summary: Committed goals with no key result and no goal below them.
    how: Goals with a GoalCommitted and none of GoalAchieved, GoalMissed and GoalDropped that have no KeyResultAdded and are the parent of no other proposed goal. Must be 0.
    direction: lower
    gate: true
    reads: [org.goal.GoalProposed, org.goal.GoalCommitted, org.goal.GoalAchieved, org.goal.GoalMissed, org.goal.GoalDropped, org.goal.KeyResultAdded]
    status: planned

  - id: key_result_current_share
    block: goal
    measures: completeness
    over: goal
    unit: share
    summary: Share of a committed goal's key results that have a current value.
    how: Key results added to the goal with at least one KeyResultMeasured, divided by the key results added to the goal, counted while the goal is committed and not ended.
    direction: higher
    gate: false
    reads: [org.goal.GoalCommitted, org.goal.GoalAchieved, org.goal.GoalMissed, org.goal.GoalDropped, org.goal.KeyResultAdded, org.goal.KeyResultMeasured]
    status: planned

  - id: goal_achieved_share
    block: goal
    measures: quality
    over: organization
    unit: share
    summary: Share of the goals that ended in a window that were achieved.
    how: GoalAchieved events divided by the sum of GoalAchieved, GoalMissed and GoalDropped events of the window, over goals that were committed.
    direction: higher
    postures: { explore: ignore, scale: higher, operate: higher }
    gate: false
    reads: [org.goal.GoalCommitted, org.goal.GoalAchieved, org.goal.GoalMissed, org.goal.GoalDropped]
    status: planned

  - id: key_result_measurement_age_days
    block: goal
    measures: quality
    over: goal
    unit: days
    summary: Age of the oldest current value among a committed goal's open key results.
    how: Days from the last KeyResultMeasured of each key result with neither KeyResultMet nor KeyResultMissed to the end of the window; the largest over the goal's key results.
    direction: lower
    gate: false
