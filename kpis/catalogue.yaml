    direction: lower
    gate: false
    reads: [org.process.StepListed, org.process.StepRemoved]
    status: planned

  - id: work_on_process_share
    block: process
    measures: quality
    over: organization
    unit: share
    summary: Share of work items that follow a step of a process.
    how: WorkItemOpened events that carry a process_id and a step_id, divided by all WorkItemOpened events of the window.
