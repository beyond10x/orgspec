[workspace]
resolver = "3"
members = ["crates/orgspec"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/orgspec"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
