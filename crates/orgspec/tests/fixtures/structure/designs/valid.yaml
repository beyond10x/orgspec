format: orgspec-organization/1
organization: bakery
type: shop
origin: invented
summary: A bakery with a board, a kitchen and a shop counter. It uses every block and every link.
parts:
  bakery:      { block: organization, form: company, purpose: "Bread for the street." }
  board:       { block: unit, nature: governing, in: bakery }
  kitchen:     { block: unit, nature: line, basis: function, in: bakery, purpose: "Bakes." }
  front:       { block: unit, kind: counter, in: bakery }
  baker:       { block: role, purpose: "Bakes.", expects: ["bakes every morning", "keeps the oven clean"] }
  seller:      { block: role }
  head:        { block: position, in: kitchen, role: baker, title: Head baker }
  hands:
    block: position
    in: kitchen
    role: baker
    seats: { value: 3, vary: { min: 2, max: 6 } }
    held_by: mixed
    agent_share: { value: 0.5, vary: [0, 0.25, 0.5] }
    answer_delay: 2h
  clerk:       { block: position, in: front, role: seller, held_by: agent }
  spend:       { block: decision_class, impact: high }
  recipe:      { block: decision_class, reversible: true }
  hygiene:     { block: policy, category: rule, scope: kitchen }
  bread:       { block: offering, audience: external }
  street:      { block: relationship, tie: customer }
  mill:        { block: relationship, tie: supplier }
  growth:      { block: goal, by: "next spring", measure: "loaves a day" }
  second_shop: { block: goal, parent: growth }
  stone_oven:  { block: asset, kind: oven, serviced_every: 26w, fuel: gas, criticality: high }
  flour_money: { block: budget, amount: 4000, currency: coins, period: 4w, for: kitchen }
  baking:
    block: process
    steps:
      - { name: knead, role: baker, activity: do }
      - { name: taste, role: baker, activity: review }
      - { name: sell, role: seller, activity: do }
  fresh_by_seven: { block: agreement, provider: kitchen, consumer: front, measure: "loaves ready at seven", target: 200 }
  morning:     { block: forum, convenes: kitchen, every: { value: 7d, vary: [1d, 7d] } }
  board_note:  { block: channel, form: record, audience: internal }
  burnt_batch: { block: risk, about: bread, likelihood: medium, impact: low, treatment: reduce }
  food_law:    { block: obligation, source: law, about: hygiene }
