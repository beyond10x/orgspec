format: orgspec-type/1
type: upper
origin: invented
extends: [lower]
summary: Declares a rule the extended type has, an id of a structural rule, and one id twice.
rules:
  - id: one_board
    summary: Exactly one governing unit.
    rule: parts
    match: { block: unit, nature: governing }
    min: 1
    max: 1
  - id: unknown_block
    summary: Takes the id of a structural rule.
    rule: depth
    max: 4
  - id: shallow
    summary: At most five levels.
    rule: depth
    max: 5
defaults:
  - id: shallow
    summary: Takes the id of a rule of this type.
    each: { block: position }
    carries: answers_to
    to: { block: position }
