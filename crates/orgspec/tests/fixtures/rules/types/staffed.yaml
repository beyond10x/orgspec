format: orgspec-type/1
type: staffed
origin: invented
summary: An organization with one governing unit whose line units are small. Rule form `parts`.
rules:
  - id: line_unit_staffed
    summary: Every line unit has at least one position and at most three.
    rule: parts
    match: { block: position }
    per: { block: unit, nature: line }
    min: 1
    max: 3
  - id: one_governing_unit
    summary: The organization has exactly one governing unit.
    rule: parts
    match: { block: unit, nature: governing }
    min: 1
    max: 1
