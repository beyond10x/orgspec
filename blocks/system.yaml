format: ess/37
system: org
version: v1

summary: >-
  The building blocks of an organization: parties, the organization and its boundary, units,
  roles, positions, memberships, assignments, competences, decision rights, delegations,
  policies, offerings, relationships, goals, assets, budgets, processes, work, agreements,
  forums, channels, escalations, responsibilities, risks, obligations, and the design that
  composes them. Each block is a contract; a system that implements one proves it against the
  block's commands, events and views.

