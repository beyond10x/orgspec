# Broken variant: the bakery's `shop` unit placed in the `bread` offering, then left unplaced
# (`part_outside_organization`).
type: ess-scenario/7
domain: org.design
scenario: bakery-unit-outside-organization
summary: A unit placed in an offering is refused, and a unit that lies nowhere refuses the commit (PartOutsideOrganization).

arrange:
  - instance: bakery
    entity: org.design.Design
  - instance: rev
    entity: org.design.DesignRevision

timeline:
  - at: 2026-11-27T09:00:00Z
    command: org.design.CreateDesign
    input: {name: bakery, at: 2026-11-27T09:00:00Z}
    outcome: created
    capture: {instance: bakery, event: org.design.DesignCreated, field: design_id}
  - at: 2026-11-27T09:00:01Z
    command: org.design.OpenRevision
    input: {design_id: {$instance: bakery}, at: 2026-11-27T09:00:01Z}
    outcome: opened
    capture: {instance: rev, event: org.design.RevisionOpened, field: revision_id}
  - at: 2026-11-27T09:00:02Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000001
      revision_id: {$instance: rev}
      name: bakery
      block: Organization
      dimensions: []
      at: 2026-11-27T09:00:02Z
    outcome: added
  - at: 2026-11-27T09:00:03Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000003
      revision_id: {$instance: rev}
      name: shop
      block: Unit
      dimensions: [{name: nature, value: line}]
      at: 2026-11-27T09:00:03Z
    outcome: added
  - at: 2026-11-27T09:00:04Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000008
      revision_id: {$instance: rev}
      name: walk-ins
      block: Relationship
      dimensions: []
      at: 2026-11-27T09:00:04Z
    outcome: added

  - at: 2026-11-27T09:00:05Z
    command: org.design.PlacePart
    input:
      revision_id: {$instance: rev}
      part_id: 00000000-0000-4000-8000-000000000003
      in_part_id: 00000000-0000-4000-8000-000000000008
      at: 2026-11-27T09:00:05Z
    outcome: unit-outside-organization
    error:
      name: org.design.PartOutsideOrganization
    no_events: [org.design.PartPlaced]
  - at: 2026-11-27T09:00:06Z
    command: org.design.CommitRevision
    input: {revision_id: {$instance: rev}, at: 2026-11-27T09:00:06Z}
    outcome: unit-outside-organization
    error:
      name: org.design.PartOutsideOrganization
    no_events: [org.design.RevisionCommitted]

  # Placed in the organization, the same revision commits.
  - at: 2026-11-27T09:00:07Z
    command: org.design.PlacePart
    input:
      revision_id: {$instance: rev}
      part_id: 00000000-0000-4000-8000-000000000003
      in_part_id: 00000000-0000-4000-8000-000000000001
      at: 2026-11-27T09:00:07Z
    outcome: placed
  - at: 2026-11-27T09:00:08Z
    command: org.design.CommitRevision
    input: {revision_id: {$instance: rev}, at: 2026-11-27T09:00:08Z}
    outcome: committed

assert:
  - view: org.design.Revisions
    contains:
      revision_id: {$instance: rev}
      state: Committed
  - view: org.design.Parts
    contains:
      part_id: 00000000-0000-4000-8000-000000000003
      in_part_id: 00000000-0000-4000-8000-000000000001
