# Broken variants of single links: a unit accountable for an offering
# (`accountable_not_position`), an offering deciding a class (`decider_not_allowed`), a position
# reporting to itself (`reporting_cycle`) and a position playing an offering as its role
# (`unknown_role`).
type: ess-scenario/7
domain: org.design
scenario: bakery-link-from-wrong-part
summary: An accountable link from a unit, a decides link from an offering, a part reporting to itself and a role that is no role part are each refused.

arrange:
  - instance: bakery
    entity: org.design.Design
  - instance: rev
    entity: org.design.DesignRevision

timeline:
  - at: 2026-11-27T09:00:00Z
    command: org.design.CreateDesign
    input: {name: bakery, at: 2026-11-27T09:00:00Z}
    outcome: created
    capture: {instance: bakery, event: org.design.DesignCreated, field: design_id}
  - at: 2026-11-27T09:00:01Z
    command: org.design.OpenRevision
    input: {design_id: {$instance: bakery}, at: 2026-11-27T09:00:01Z}
    outcome: opened
    capture: {instance: rev, event: org.design.RevisionOpened, field: revision_id}
  - at: 2026-11-27T09:00:02Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000003
      revision_id: {$instance: rev}
      name: shop
      block: Unit
      dimensions: []
      at: 2026-11-27T09:00:02Z
    outcome: added
  - at: 2026-11-27T09:00:03Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000005
      revision_id: {$instance: rev}
      name: head-baker
      block: Position
      dimensions: []
      at: 2026-11-27T09:00:03Z
    outcome: added
  - at: 2026-11-27T09:00:04Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000007
      revision_id: {$instance: rev}
      name: bread
      block: Offering
      dimensions: []
      at: 2026-11-27T09:00:04Z
    outcome: added
  - at: 2026-11-27T09:00:05Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000009
      revision_id: {$instance: rev}
      name: prices
      block: DecisionClass
      dimensions: []
      at: 2026-11-27T09:00:05Z
    outcome: added
  # A second part of a name the revision has is refused.
  - at: 2026-11-27T09:00:06Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-00000000000c
      revision_id: {$instance: rev}
      name: bread
      block: Asset
      dimensions: []
      at: 2026-11-27T09:00:06Z
    outcome: name-taken
    error:
      name: org.design.PartNameTaken
    no_events: [org.design.PartAdded]

  - at: 2026-11-27T09:00:07Z
    command: org.design.AddLink
    input:
      revision_id: {$instance: rev}
      from_part_id: 00000000-0000-4000-8000-000000000003
      to_part_id: 00000000-0000-4000-8000-000000000007
      carries: accountable
      at: 2026-11-27T09:00:07Z
    outcome: accountable-not-position
    error:
      name: org.design.AccountableNotPosition
    no_events: [org.design.LinkAdded]
  - at: 2026-11-27T09:00:08Z
    command: org.design.AddLink
    input:
      revision_id: {$instance: rev}
      from_part_id: 00000000-0000-4000-8000-000000000007
      to_part_id: 00000000-0000-4000-8000-000000000009
      carries: decides
      at: 2026-11-27T09:00:08Z
    outcome: decider-not-allowed
    error:
      name: org.design.DeciderNotAllowed
    no_events: [org.design.LinkAdded]
  - at: 2026-11-27T09:00:09Z
    command: org.design.AddLink
    input:
      revision_id: {$instance: rev}
      from_part_id: 00000000-0000-4000-8000-000000000005
      to_part_id: 00000000-0000-4000-8000-000000000005
      carries: reports_to
      at: 2026-11-27T09:00:09Z
    outcome: reports-to-itself
    error:
      name: org.design.ReportingCycle
    no_events: [org.design.LinkAdded]
  - at: 2026-11-27T09:00:10Z
    command: org.design.SetRole
    input:
      revision_id: {$instance: rev}
      part_id: 00000000-0000-4000-8000-000000000005
      role_part_id: 00000000-0000-4000-8000-000000000007
      at: 2026-11-27T09:00:10Z
    outcome: not-a-role
    error:
      name: org.design.UnknownRole
    no_events: [org.design.PartRoleSet]

assert:
  - view: org.design.Links
    params:
      revision_id: {$instance: rev}
    counts:
      at_most: 0
  - view: org.design.Parts
    excludes:
      part_id: 00000000-0000-4000-8000-00000000000c
