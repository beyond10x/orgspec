# Broken variant: the bakery's `counter` position placed in the organization itself, then left
# unplaced (`part_outside_organization`).
type: ess-scenario/7
domain: org.design
scenario: bakery-position-outside-unit
summary: A position placed in an organization part is refused, and a position that lies in no unit refuses the commit (PartOutsideOrganization).

arrange:
  - instance: bakery
    entity: org.design.Design
  - instance: rev
    entity: org.design.DesignRevision

timeline:
  - at: 2026-11-27T09:00:00Z
    command: org.design.CreateDesign
    input: {name: bakery, at: 2026-11-27T09:00:00Z}
    outcome: created
    capture: {instance: bakery, event: org.design.DesignCreated, field: design_id}
  - at: 2026-11-27T09:00:01Z
    command: org.design.OpenRevision
    input: {design_id: {$instance: bakery}, at: 2026-11-27T09:00:01Z}
    outcome: opened
    capture: {instance: rev, event: org.design.RevisionOpened, field: revision_id}
  - at: 2026-11-27T09:00:02Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000001
      revision_id: {$instance: rev}
      name: bakery
      block: Organization
      dimensions: []
      at: 2026-11-27T09:00:02Z
    outcome: added
  - at: 2026-11-27T09:00:03Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000006
      revision_id: {$instance: rev}
      name: counter
      block: Position
      dimensions: []
      at: 2026-11-27T09:00:03Z
    outcome: added

  - at: 2026-11-27T09:00:04Z
    command: org.design.PlacePart
    input:
      revision_id: {$instance: rev}
      part_id: 00000000-0000-4000-8000-000000000006
      in_part_id: 00000000-0000-4000-8000-000000000001
      at: 2026-11-27T09:00:04Z
    outcome: position-outside-unit
    error:
      name: org.design.PartOutsideOrganization
    no_events: [org.design.PartPlaced]
  - at: 2026-11-27T09:00:05Z
    command: org.design.CommitRevision
    input: {revision_id: {$instance: rev}, at: 2026-11-27T09:00:05Z}
    outcome: position-outside-unit
    error:
      name: org.design.PartOutsideOrganization
    no_events: [org.design.RevisionCommitted]

assert:
  - view: org.design.Revisions
    contains:
      revision_id: {$instance: rev}
      state: Draft
