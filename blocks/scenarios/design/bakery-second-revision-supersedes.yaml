# Two revisions of one design. A committed revision is frozen, one draft is open at a time, and
# the commit of the second revision supersedes the first.
type: ess-scenario/7
domain: org.design
scenario: bakery-second-revision-supersedes
summary: A committed revision takes no part, a design has one draft at a time, and committing the next revision supersedes the one before.

arrange:
  - instance: bakery
    entity: org.design.Design
  - instance: first
    entity: org.design.DesignRevision
  - instance: second
    entity: org.design.DesignRevision

timeline:
  - at: 2026-11-27T09:00:00Z
    command: org.design.CreateDesign
    input: {name: bakery, at: 2026-11-27T09:00:00Z}
    outcome: created
    capture: {instance: bakery, event: org.design.DesignCreated, field: design_id}
  - at: 2026-11-27T09:00:01Z
    command: org.design.OpenRevision
    input: {design_id: {$instance: bakery}, at: 2026-11-27T09:00:01Z}
    outcome: opened
    capture: {instance: first, event: org.design.RevisionOpened, field: revision_id}
  - at: 2026-11-27T09:00:02Z
    command: org.design.OpenRevision
    input: {design_id: {$instance: bakery}, at: 2026-11-27T09:00:02Z}
    outcome: draft-open
    error:
      name: org.design.DraftRevisionOpen
    no_events: [org.design.RevisionOpened]
  - at: 2026-11-27T09:00:03Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000001
      revision_id: {$instance: first}
      name: bakery
      block: Organization
      dimensions: []
      at: 2026-11-27T09:00:03Z
    outcome: added
  - at: 2026-11-27T09:00:04Z
    command: org.design.CommitRevision
    input: {revision_id: {$instance: first}, at: 2026-11-27T09:00:04Z}
    outcome: committed

  # frozen
  - at: 2026-11-27T09:00:05Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000003
      revision_id: {$instance: first}
      name: shop
      block: Unit
      dimensions: []
      at: 2026-11-27T09:00:05Z
    outcome: revision-not-draft
    error:
      name: org.design.RevisionNotDraft
    no_events: [org.design.PartAdded]
  - at: 2026-11-27T09:00:06Z
    command: org.design.CommitRevision
    input: {revision_id: {$instance: first}, at: 2026-11-27T09:00:06Z}
    outcome: wrong-state
    error:
      name: org.design.RevisionNotDraft
    no_events: [org.design.RevisionCommitted]

  # the next revision
  - at: 2026-11-27T10:00:00Z
    command: org.design.OpenRevision
    input: {design_id: {$instance: bakery}, at: 2026-11-27T10:00:00Z}
    outcome: opened
    capture: {instance: second, event: org.design.RevisionOpened, field: revision_id}
  - at: 2026-11-27T10:00:01Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000011
      revision_id: {$instance: second}
      name: bakery
      block: Organization
      dimensions: []
      at: 2026-11-27T10:00:01Z
    outcome: added
  - at: 2026-11-27T10:00:02Z
    command: org.design.CommitRevision
    input: {revision_id: {$instance: second}, at: 2026-11-27T10:00:02Z}
    outcome: committed

assert:
  - view: org.design.Revisions
    contains:
      revision_id: {$instance: first}
      state: Superseded
  - view: org.design.Revisions
    contains:
      revision_id: {$instance: second}
      state: Committed
      committed_at: 2026-11-27T10:00:02Z
