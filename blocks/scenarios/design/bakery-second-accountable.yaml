# Broken variant: the bakery with both positions accountable for `bread`
# (`subject_with_two_accountables`).
type: ess-scenario/7
domain: org.design
scenario: bakery-second-accountable
summary: A second accountable link to one offering is refused (SubjectWithTwoAccountables), and the first stays the only one.

arrange:
  - instance: bakery
    entity: org.design.Design
  - instance: rev
    entity: org.design.DesignRevision

timeline:
  - at: 2026-11-27T09:00:00Z
    command: org.design.CreateDesign
    input: {name: bakery, at: 2026-11-27T09:00:00Z}
    outcome: created
    capture: {instance: bakery, event: org.design.DesignCreated, field: design_id}
  - at: 2026-11-27T09:00:01Z
    command: org.design.OpenRevision
    input: {design_id: {$instance: bakery}, at: 2026-11-27T09:00:01Z}
    outcome: opened
    capture: {instance: rev, event: org.design.RevisionOpened, field: revision_id}
  - at: 2026-11-27T09:00:02Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000005
      revision_id: {$instance: rev}
      name: head-baker
      block: Position
      held_by: Human
      dimensions: []
      at: 2026-11-27T09:00:02Z
    outcome: added
  - at: 2026-11-27T09:00:03Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000006
      revision_id: {$instance: rev}
      name: counter
      block: Position
      held_by: Human
      dimensions: []
      at: 2026-11-27T09:00:03Z
    outcome: added
  - at: 2026-11-27T09:00:04Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000007
      revision_id: {$instance: rev}
      name: bread
      block: Offering
      dimensions: []
      at: 2026-11-27T09:00:04Z
    outcome: added

  - at: 2026-11-27T09:00:05Z
    command: org.design.AddLink
    input:
      revision_id: {$instance: rev}
      from_part_id: 00000000-0000-4000-8000-000000000005
      to_part_id: 00000000-0000-4000-8000-000000000007
      carries: accountable
      at: 2026-11-27T09:00:05Z
    outcome: added
  - at: 2026-11-27T09:00:06Z
    command: org.design.AddLink
    input:
      revision_id: {$instance: rev}
      from_part_id: 00000000-0000-4000-8000-000000000006
      to_part_id: 00000000-0000-4000-8000-000000000007
      carries: accountable
      at: 2026-11-27T09:00:06Z
    outcome: second-accountable
    error:
      name: org.design.SubjectWithTwoAccountables
    no_events: [org.design.LinkAdded]
  # Responsible is no second accountable.
  - at: 2026-11-27T09:00:07Z
    command: org.design.AddLink
    input:
      revision_id: {$instance: rev}
      from_part_id: 00000000-0000-4000-8000-000000000006
      to_part_id: 00000000-0000-4000-8000-000000000007
      carries: responsible
      at: 2026-11-27T09:00:07Z
    outcome: added

assert:
  - view: org.design.Links
    params:
      revision_id: {$instance: rev}
    counts:
      at_least: 2
      at_most: 2
  - view: org.design.Links
    params:
      revision_id: {$instance: rev}
    excludes:
      from_name: counter
      carries: accountable
