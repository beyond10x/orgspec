# Broken variant: the bakery's head baker passes the `spend` class on to the counter without
# holding it (`delegation_without_right`). Once the owners, who decide `spend`, delegate it to the
# head baker, the same revision commits.
type: ess-scenario/7
domain: org.design
scenario: bakery-delegation-without-right
summary: A delegation of a class its giver neither decides nor was delegated refuses the commit (DelegationWithoutRight).

arrange:
  - instance: bakery
    entity: org.design.Design
  - instance: rev
    entity: org.design.DesignRevision

timeline:
  - at: 2026-11-27T09:00:00Z
    command: org.design.CreateDesign
    input: {name: bakery, at: 2026-11-27T09:00:00Z}
    outcome: created
    capture: {instance: bakery, event: org.design.DesignCreated, field: design_id}
  - at: 2026-11-27T09:00:01Z
    command: org.design.OpenRevision
    input: {design_id: {$instance: bakery}, at: 2026-11-27T09:00:01Z}
    outcome: opened
    capture: {instance: rev, event: org.design.RevisionOpened, field: revision_id}
  - at: 2026-11-27T09:00:02Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000001
      revision_id: {$instance: rev}
      name: bakery
      block: Organization
      dimensions: []
      at: 2026-11-27T09:00:02Z
    outcome: added
  - at: 2026-11-27T09:00:03Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000002
      revision_id: {$instance: rev}
      name: owners
      block: Unit
      dimensions: [{name: nature, value: governing}]
      at: 2026-11-27T09:00:03Z
    outcome: added
  - at: 2026-11-27T09:00:04Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000005
      revision_id: {$instance: rev}
      name: head-baker
      block: Position
      dimensions: []
      at: 2026-11-27T09:00:04Z
    outcome: added
  - at: 2026-11-27T09:00:05Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000006
      revision_id: {$instance: rev}
      name: counter
      block: Position
      dimensions: []
      at: 2026-11-27T09:00:05Z
    outcome: added
  - at: 2026-11-27T09:00:06Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-00000000000b
      revision_id: {$instance: rev}
      name: spend
      block: DecisionClass
      dimensions: []
      at: 2026-11-27T09:00:06Z
    outcome: added
  - at: 2026-11-27T09:00:07Z
    command: org.design.PlacePart
    input:
      revision_id: {$instance: rev}
      part_id: 00000000-0000-4000-8000-000000000002
      in_part_id: 00000000-0000-4000-8000-000000000001
      at: 2026-11-27T09:00:07Z
    outcome: placed
  - at: 2026-11-27T09:00:08Z
    command: org.design.PlacePart
    input:
      revision_id: {$instance: rev}
      part_id: 00000000-0000-4000-8000-000000000005
      in_part_id: 00000000-0000-4000-8000-000000000002
      at: 2026-11-27T09:00:08Z
    outcome: placed
  - at: 2026-11-27T09:00:09Z
    command: org.design.PlacePart
    input:
      revision_id: {$instance: rev}
      part_id: 00000000-0000-4000-8000-000000000006
      in_part_id: 00000000-0000-4000-8000-000000000002
      at: 2026-11-27T09:00:09Z
    outcome: placed

  - at: 2026-11-27T09:00:10Z
    command: org.design.AddLink
    input:
      revision_id: {$instance: rev}
      from_part_id: 00000000-0000-4000-8000-000000000002
      to_part_id: 00000000-0000-4000-8000-00000000000b
      carries: decides
      mode: Consent
      at: 2026-11-27T09:00:10Z
    outcome: added
  - at: 2026-11-27T09:00:11Z
    command: org.design.AddLink
    input:
      revision_id: {$instance: rev}
      from_part_id: 00000000-0000-4000-8000-000000000005
      to_part_id: 00000000-0000-4000-8000-000000000006
      carries: delegates
      class_part_id: 00000000-0000-4000-8000-00000000000b
      limit: {micro_units: 200000000, currency: XXX}
      at: 2026-11-27T09:00:11Z
    outcome: added

  - at: 2026-11-27T09:00:12Z
    command: org.design.CommitRevision
    input: {revision_id: {$instance: rev}, at: 2026-11-27T09:00:12Z}
    outcome: delegation-without-right
    error:
      name: org.design.DelegationWithoutRight
    no_events: [org.design.RevisionCommitted]

  # The owners decide `spend` and pass it to the head baker, who may then pass it on.
  - at: 2026-11-27T09:00:13Z
    command: org.design.AddLink
    input:
      revision_id: {$instance: rev}
      from_part_id: 00000000-0000-4000-8000-000000000002
      to_part_id: 00000000-0000-4000-8000-000000000005
      carries: delegates
      class_part_id: 00000000-0000-4000-8000-00000000000b
      limit: {micro_units: 500000000, currency: XXX}
      at: 2026-11-27T09:00:13Z
    outcome: added
  - at: 2026-11-27T09:00:14Z
    command: org.design.CommitRevision
    input: {revision_id: {$instance: rev}, at: 2026-11-27T09:00:14Z}
    outcome: committed

assert:
  - view: org.design.Revisions
    contains:
      revision_id: {$instance: rev}
      state: Committed
  - view: org.design.Links
    params:
      revision_id: {$instance: rev}
    counts:
      at_least: 3
      at_most: 3
