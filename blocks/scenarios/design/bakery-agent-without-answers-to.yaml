# Broken variant: the bakery with an `oven-watch` position held by agents that answers to no
# position (`agent_without_accountable_human`, the first link of the chain). With the link
# `oven-watch answers_to head-baker` the same revision commits.
type: ess-scenario/7
domain: org.design
scenario: bakery-agent-without-answers-to
summary: An agent-held position with no answers_to link refuses the commit (AgentWithoutAccountableHuman); with the link it commits.

arrange:
  - instance: bakery
    entity: org.design.Design
  - instance: rev
    entity: org.design.DesignRevision

timeline:
  - at: 2026-11-27T09:00:00Z
    command: org.design.CreateDesign
    input: {name: bakery, at: 2026-11-27T09:00:00Z}
    outcome: created
    capture: {instance: bakery, event: org.design.DesignCreated, field: design_id}
  - at: 2026-11-27T09:00:01Z
    command: org.design.OpenRevision
    input: {design_id: {$instance: bakery}, at: 2026-11-27T09:00:01Z}
    outcome: opened
    capture: {instance: rev, event: org.design.RevisionOpened, field: revision_id}
  - at: 2026-11-27T09:00:02Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000001
      revision_id: {$instance: rev}
      name: bakery
      block: Organization
      dimensions: []
      at: 2026-11-27T09:00:02Z
    outcome: added
  - at: 2026-11-27T09:00:03Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000003
      revision_id: {$instance: rev}
      name: shop
      block: Unit
      dimensions: []
      at: 2026-11-27T09:00:03Z
    outcome: added
  # No held_by: the position reads as held by humans.
  - at: 2026-11-27T09:00:04Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-000000000005
      revision_id: {$instance: rev}
      name: head-baker
      block: Position
      dimensions: []
      at: 2026-11-27T09:00:04Z
    outcome: added
  - at: 2026-11-27T09:00:05Z
    command: org.design.AddPart
    input:
      part_id: 00000000-0000-4000-8000-00000000000a
      revision_id: {$instance: rev}
      name: oven-watch
      block: Position
      held_by: Agent
      seats: 3
      dimensions: []
      at: 2026-11-27T09:00:05Z
    outcome: added
  - at: 2026-11-27T09:00:06Z
    command: org.design.PlacePart
    input:
      revision_id: {$instance: rev}
      part_id: 00000000-0000-4000-8000-000000000003
      in_part_id: 00000000-0000-4000-8000-000000000001
      at: 2026-11-27T09:00:06Z
    outcome: placed
  - at: 2026-11-27T09:00:07Z
    command: org.design.PlacePart
    input:
      revision_id: {$instance: rev}
      part_id: 00000000-0000-4000-8000-000000000005
      in_part_id: 00000000-0000-4000-8000-000000000003
      at: 2026-11-27T09:00:07Z
    outcome: placed
  - at: 2026-11-27T09:00:08Z
    command: org.design.PlacePart
    input:
      revision_id: {$instance: rev}
      part_id: 00000000-0000-4000-8000-00000000000a
      in_part_id: 00000000-0000-4000-8000-000000000003
      at: 2026-11-27T09:00:08Z
    outcome: placed

  - at: 2026-11-27T09:00:09Z
    command: org.design.CommitRevision
    input: {revision_id: {$instance: rev}, at: 2026-11-27T09:00:09Z}
    outcome: agent-without-answers-to
    error:
      name: org.design.AgentWithoutAccountableHuman
    no_events: [org.design.RevisionCommitted]

  - at: 2026-11-27T09:00:10Z
    command: org.design.AddLink
    input:
      revision_id: {$instance: rev}
      from_part_id: 00000000-0000-4000-8000-00000000000a
      to_part_id: 00000000-0000-4000-8000-000000000005
      carries: answers_to
      at: 2026-11-27T09:00:10Z
    outcome: added
  - at: 2026-11-27T09:00:11Z
    command: org.design.CommitRevision
    input: {revision_id: {$instance: rev}, at: 2026-11-27T09:00:11Z}
    outcome: committed

assert:
  - view: org.design.Revisions
    contains:
      revision_id: {$instance: rev}
      state: Committed
  - view: org.design.Links
    params:
      revision_id: {$instance: rev}
    contains:
      from_name: oven-watch
      to_name: head-baker
      carries: answers_to
