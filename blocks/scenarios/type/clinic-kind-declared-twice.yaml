# Broken variant: the clinic type declares the kind `ward` twice in one revision
# (`kind_declared_twice`), the second time for another block.
type: ess-scenario/7
domain: org.type
scenario: clinic-kind-declared-twice
summary: A kind name a revision already declares is refused (KindDeclaredTwice), also for another block.

arrange:
  - instance: rev
    entity: org.type.TypeRevision

timeline:
  - at: 2026-11-27T09:00:00Z
    command: org.type.DeclareType
    input:
      type_id: 00000000-0000-4000-8000-000000000102
      name: clinic
      summary: A practice with wards and practitioners.
      at: 2026-11-27T09:00:00Z
    outcome: declared
  - at: 2026-11-27T09:00:01Z
    command: org.type.OpenRevision
    input: {type_id: 00000000-0000-4000-8000-000000000102, at: 2026-11-27T09:00:01Z}
    outcome: opened
    capture: {instance: rev, event: org.type.RevisionOpened, field: revision_id}
  - at: 2026-11-27T09:00:02Z
    command: org.type.DeclareKind
    input:
      kind_id: 00000000-0000-4000-8000-000000000111
      revision_id: {$instance: rev}
      name: ward
      block: Unit
      summary: A unit that treats one group of patients.
      at: 2026-11-27T09:00:02Z
    outcome: declared
  - at: 2026-11-27T09:00:03Z
    command: org.type.DeclareKind
    input:
      kind_id: 00000000-0000-4000-8000-000000000114
      revision_id: {$instance: rev}
      name: ward
      block: Forum
      summary: The round the practitioners of a ward hold each morning.
      at: 2026-11-27T09:00:03Z
    outcome: declared-twice
    error:
      name: org.type.KindDeclaredTwice
    no_events: [org.type.KindDeclared]

assert:
  - view: org.type.Kinds
    counts:
      at_least: 1
      at_most: 1
  - view: org.type.Kinds
    excludes:
      kind_id: 00000000-0000-4000-8000-000000000114
