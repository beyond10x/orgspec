# Two revisions of the clinic type. The published first revision takes no change
# (`published_revision_changed`). The second revision may not declare the gate rule of the first
# as a rule that is no gate (`gate_loosened`); declared as a gate it publishes, and the first
# revision is superseded.
type: ess-scenario/7
domain: org.type
scenario: clinic-gate-loosened
summary: A published revision is frozen; a later revision turning a gate rule into no gate is refused (GateLoosened); publishing it supersedes the first.

arrange:
  - instance: first
    entity: org.type.TypeRevision
  - instance: second
    entity: org.type.TypeRevision

timeline:
  - at: 2026-11-27T09:00:00Z
    command: org.type.DeclareType
    input:
      type_id: 00000000-0000-4000-8000-000000000101
      name: base
      summary: What every organization design is checked with.
      at: 2026-11-27T09:00:00Z
    outcome: declared
  - at: 2026-11-27T09:00:01Z
    command: org.type.DeclareType
    input:
      type_id: 00000000-0000-4000-8000-000000000102
      name: clinic
      summary: A practice with wards and practitioners.
      at: 2026-11-27T09:00:01Z
    outcome: declared
  - at: 2026-11-27T09:00:02Z
    command: org.type.OpenRevision
    input: {type_id: 00000000-0000-4000-8000-000000000102, at: 2026-11-27T09:00:02Z}
    outcome: opened
    capture: {instance: first, event: org.type.RevisionOpened, field: revision_id}
  - at: 2026-11-27T09:00:03Z
    command: org.type.DeclareRule
    input:
      type_id: 00000000-0000-4000-8000-000000000102
      revision_id: {$instance: first}
      rule_id: ward_has_consultant
      form: Parts
      gate: true
      summary: Every ward has at least one consultant.
      body: "parts: {kind: consultant, in: ward, min: 1}"
      at: 2026-11-27T09:00:03Z
    outcome: declared
  - at: 2026-11-27T09:00:04Z
    command: org.type.PublishRevision
    input: {revision_id: {$instance: first}, at: 2026-11-27T09:00:04Z}
    outcome: published

  # frozen
  - at: 2026-11-27T09:00:05Z
    command: org.type.DeclareKind
    input:
      kind_id: 00000000-0000-4000-8000-000000000111
      revision_id: {$instance: first}
      name: ward
      block: Unit
      summary: A unit that treats one group of patients.
      at: 2026-11-27T09:00:05Z
    outcome: revision-not-draft
    error:
      name: org.type.PublishedRevisionChanged
    no_events: [org.type.KindDeclared]
  - at: 2026-11-27T09:00:06Z
    command: org.type.DeclareRule
    input:
      type_id: 00000000-0000-4000-8000-000000000102
      revision_id: {$instance: first}
      rule_id: consultant_span
      form: Span
      gate: false
      summary: A consultant supervises at most eight practitioners.
      body: "span: {kind: consultant, carries: supervises, max: 8}"
      at: 2026-11-27T09:00:06Z
    outcome: revision-not-draft
    error:
      name: org.type.PublishedRevisionChanged
    no_events: [org.type.RuleDeclared]
  - at: 2026-11-27T09:00:07Z
    command: org.type.ExtendType
    input:
      type_id: 00000000-0000-4000-8000-000000000102
      extended_type_id: 00000000-0000-4000-8000-000000000101
      at: 2026-11-27T09:00:07Z
    outcome: revision-published
    error:
      name: org.type.PublishedRevisionChanged
    no_events: [org.type.TypeExtended]
  - at: 2026-11-27T09:00:08Z
    command: org.type.PublishRevision
    input: {revision_id: {$instance: first}, at: 2026-11-27T09:00:08Z}
    outcome: wrong-state
    error:
      name: org.type.PublishedRevisionChanged
    no_events: [org.type.RevisionPublished]

  # the next revision
  - at: 2026-11-27T10:00:00Z
    command: org.type.OpenRevision
    input: {type_id: 00000000-0000-4000-8000-000000000102, at: 2026-11-27T10:00:00Z}
    outcome: opened
    capture: {instance: second, event: org.type.RevisionOpened, field: revision_id}
  - at: 2026-11-27T10:00:01Z
    command: org.type.DeclareRule
    input:
      type_id: 00000000-0000-4000-8000-000000000102
      revision_id: {$instance: second}
      rule_id: ward_has_consultant
      form: Parts
      gate: false
      summary: Every ward has at least one consultant.
      body: "parts: {kind: consultant, in: ward, min: 1}"
      at: 2026-11-27T10:00:01Z
    outcome: gate-loosened
    error:
      name: org.type.GateLoosened
    no_events: [org.type.RuleDeclared]
  - at: 2026-11-27T10:00:02Z
    command: org.type.DeclareRule
    input:
      type_id: 00000000-0000-4000-8000-000000000102
      revision_id: {$instance: second}
      rule_id: ward_has_consultant
      form: Parts
      gate: true
      summary: Every ward has at least two consultants.
      body: "parts: {kind: consultant, in: ward, min: 2}"
      at: 2026-11-27T10:00:02Z
    outcome: declared
  - at: 2026-11-27T10:00:03Z
    command: org.type.PublishRevision
    input: {revision_id: {$instance: second}, at: 2026-11-27T10:00:03Z}
    outcome: published

assert:
  - view: org.type.Revisions
    contains:
      revision_id: {$instance: first}
      state: Superseded
  - view: org.type.Revisions
    contains:
      revision_id: {$instance: second}
      state: Published
  - view: org.type.Rules
    counts:
      at_least: 2
      at_most: 2
  - view: org.type.Kinds
    counts:
      at_most: 0
