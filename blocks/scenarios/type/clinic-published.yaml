# An invented organization type `clinic` that extends `base`: three kinds, one of them refining
# another of the same block, one link name, one gate rule and one default. Its first revision is
# published.
type: ess-scenario/7
domain: org.type
scenario: clinic-published
summary: A type that extends another declares kinds, a link name, a rule and a default in a draft revision, and the revision publishes.

arrange:
  - instance: rev
    entity: org.type.TypeRevision

timeline:
  - at: 2026-11-27T09:00:00Z
    command: org.type.DeclareType
    input:
      type_id: 00000000-0000-4000-8000-000000000101
      name: base
      summary: What every organization design is checked with.
      at: 2026-11-27T09:00:00Z
    outcome: declared
  - at: 2026-11-27T09:00:01Z
    command: org.type.DeclareType
    input:
      type_id: 00000000-0000-4000-8000-000000000102
      name: clinic
      summary: A practice with wards and practitioners.
      at: 2026-11-27T09:00:01Z
    outcome: declared
  - at: 2026-11-27T09:00:02Z
    command: org.type.ExtendType
    input:
      type_id: 00000000-0000-4000-8000-000000000102
      extended_type_id: 00000000-0000-4000-8000-000000000101
      at: 2026-11-27T09:00:02Z
    outcome: extended
  - at: 2026-11-27T09:00:03Z
    command: org.type.OpenRevision
    input: {type_id: 00000000-0000-4000-8000-000000000102, at: 2026-11-27T09:00:03Z}
    outcome: opened
    capture: {instance: rev, event: org.type.RevisionOpened, field: revision_id}

  - at: 2026-11-27T09:00:04Z
    command: org.type.DeclareKind
    input:
      kind_id: 00000000-0000-4000-8000-000000000111
      revision_id: {$instance: rev}
      name: ward
      block: Unit
      summary: A unit that treats one group of patients.
      at: 2026-11-27T09:00:04Z
    outcome: declared
  - at: 2026-11-27T09:00:05Z
    command: org.type.DeclareKind
    input:
      kind_id: 00000000-0000-4000-8000-000000000112
      revision_id: {$instance: rev}
      name: practitioner
      block: Position
      summary: A position that treats patients.
      at: 2026-11-27T09:00:05Z
    outcome: declared
  - at: 2026-11-27T09:00:06Z
    command: org.type.DeclareKind
    input:
      kind_id: 00000000-0000-4000-8000-000000000113
      revision_id: {$instance: rev}
      name: consultant
      block: Position
      summary: A practitioner who supervises others.
      at: 2026-11-27T09:00:06Z
    outcome: declared
  - at: 2026-11-27T09:00:07Z
    command: org.type.RefineKind
    input:
      revision_id: {$instance: rev}
      kind_id: 00000000-0000-4000-8000-000000000113
      refines: 00000000-0000-4000-8000-000000000112
      at: 2026-11-27T09:00:07Z
    outcome: refined
  - at: 2026-11-27T09:00:08Z
    command: org.type.DeclareLinkName
    input:
      revision_id: {$instance: rev}
      name: supervises
      summary: A consultant answers for the treatment a practitioner gives.
      at: 2026-11-27T09:00:08Z
    outcome: declared
  - at: 2026-11-27T09:00:09Z
    command: org.type.DeclareRule
    input:
      type_id: 00000000-0000-4000-8000-000000000102
      revision_id: {$instance: rev}
      rule_id: ward_has_consultant
      form: Parts
      gate: true
      summary: Every ward has at least one consultant.
      body: "parts: {kind: consultant, in: ward, min: 1}"
      at: 2026-11-27T09:00:09Z
    outcome: declared
  - at: 2026-11-27T09:00:10Z
    command: org.type.DeclareDefault
    input:
      revision_id: {$instance: rev}
      default_id: practitioner_supervised
      carries: supervises
      summary: A practitioner with no supervises link is supervised by the consultant of the ward.
      body: "from: {kind: consultant, in: ward}, to: {kind: practitioner, in: ward}"
      at: 2026-11-27T09:00:10Z
    outcome: declared

  - at: 2026-11-27T09:00:11Z
    command: org.type.PublishRevision
    input: {revision_id: {$instance: rev}, at: 2026-11-27T09:00:11Z}
    outcome: published

assert:
  - view: org.type.Types
    contains:
      type_id: 00000000-0000-4000-8000-000000000102
      name: clinic
      extends: [00000000-0000-4000-8000-000000000101]
  - view: org.type.Revisions
    contains:
      revision_id: {$instance: rev}
      type_id: 00000000-0000-4000-8000-000000000102
      state: Published
      published_at: 2026-11-27T09:00:11Z
  - view: org.type.Kinds
    contains:
      kind_id: 00000000-0000-4000-8000-000000000113
      name: consultant
      block: Position
      refines: 00000000-0000-4000-8000-000000000112
  - view: org.type.Kinds
    counts:
      at_least: 3
      at_most: 3
  - view: org.type.LinkNames
    contains:
      name: supervises
  - view: org.type.Rules
    contains:
      rule_id: ward_has_consultant
      form: Parts
      gate: true
  - view: org.type.Defaults
    contains:
      default_id: practitioner_supervised
      carries: supervises
