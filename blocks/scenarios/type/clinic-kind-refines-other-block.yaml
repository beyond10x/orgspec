# Broken variant: in the clinic type a unit kind refines a position kind, a kind refines itself,
# and a kind refines a kind the revision does not declare.
type: ess-scenario/7
domain: org.type
scenario: clinic-kind-refines-other-block
summary: A kind refining a kind of another block (KindRefinesOtherBlock), itself (KindRefinesItself) or an undeclared kind (NoSuchKind) is refused.

arrange:
  - instance: rev
    entity: org.type.TypeRevision

timeline:
  - at: 2026-11-27T09:00:00Z
    command: org.type.DeclareType
    input:
      type_id: 00000000-0000-4000-8000-000000000102
      name: clinic
      summary: A practice with wards and practitioners.
      at: 2026-11-27T09:00:00Z
    outcome: declared
  - at: 2026-11-27T09:00:01Z
    command: org.type.OpenRevision
    input: {type_id: 00000000-0000-4000-8000-000000000102, at: 2026-11-27T09:00:01Z}
    outcome: opened
    capture: {instance: rev, event: org.type.RevisionOpened, field: revision_id}
  - at: 2026-11-27T09:00:02Z
    command: org.type.DeclareKind
    input:
      kind_id: 00000000-0000-4000-8000-000000000111
      revision_id: {$instance: rev}
      name: ward
      block: Unit
      summary: A unit that treats one group of patients.
      at: 2026-11-27T09:00:02Z
    outcome: declared
  - at: 2026-11-27T09:00:03Z
    command: org.type.DeclareKind
    input:
      kind_id: 00000000-0000-4000-8000-000000000112
      revision_id: {$instance: rev}
      name: practitioner
      block: Position
      summary: A position that treats patients.
      at: 2026-11-27T09:00:03Z
    outcome: declared

  - at: 2026-11-27T09:00:04Z
    command: org.type.RefineKind
    input:
      revision_id: {$instance: rev}
      kind_id: 00000000-0000-4000-8000-000000000111
      refines: 00000000-0000-4000-8000-000000000112
      at: 2026-11-27T09:00:04Z
    outcome: other-block
    error:
      name: org.type.KindRefinesOtherBlock
    no_events: [org.type.KindRefined]
  - at: 2026-11-27T09:00:05Z
    command: org.type.RefineKind
    input:
      revision_id: {$instance: rev}
      kind_id: 00000000-0000-4000-8000-000000000112
      refines: 00000000-0000-4000-8000-000000000112
      at: 2026-11-27T09:00:05Z
    outcome: refines-itself
    error:
      name: org.type.KindRefinesItself
    no_events: [org.type.KindRefined]
  - at: 2026-11-27T09:00:06Z
    command: org.type.RefineKind
    input:
      revision_id: {$instance: rev}
      kind_id: 00000000-0000-4000-8000-000000000112
      refines: 00000000-0000-4000-8000-000000000119
      at: 2026-11-27T09:00:06Z
    outcome: no-such-refined-kind
    error:
      name: org.type.NoSuchKind
    no_events: [org.type.KindRefined]

assert:
  - view: org.type.Kinds
    contains:
      kind_id: 00000000-0000-4000-8000-000000000111
      name: ward
      block: Unit
  - view: org.type.Kinds
    excludes:
      refines: 00000000-0000-4000-8000-000000000112
